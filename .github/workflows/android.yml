name: Build Orbe Convoy APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cp node_modules/@capacitor/core/dist/capacitor.js www/

      - name: Create Android project
        run: |
          npx cap add android
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          cp -r android-res/* $RES/
          # notification text/colour for the background location service
          sed -i 's#</resources>#  <color name="capacitor_background_geolocation_notification_color">\#FFC629</color>\n</resources>#' $RES/values/strings.xml || true
          # version number = build number, so new builds install over old ones
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../OrbeConvoy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OrbeConvoy
          path: OrbeConvoy.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Orbe Convoy 1.0.${{ github.run_number }}
          body: Download OrbeConvoy.apk below and open it on your Android phone to install.
          files: OrbeConvoy.apk
          make_latest: true
